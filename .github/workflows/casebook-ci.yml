name: CASEBOOK CI

on:
  push:
    branches:
      - 'review/**'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: casebook-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-stdlib:
    name: Python stdlib regression
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node.js 24)
        with:
          persist-credentials: false
      - name: Reject private evidence in tracked source
        shell: bash
        run: |
          python3 -B - <<'PY'
          from pathlib import PurePosixPath
          from subprocess import check_output
          tracked = [x.decode("utf-8") for x in
                     check_output(["git", "ls-files", "-z"]).split(b"\0") if x]
          bad = []
          for name in tracked:
              path = PurePosixPath(name)
              if (path.suffix in {".db", ".sqlite", ".sqlite3", ".jsonl", ".pem", ".key", ".enc"}
                      or any(part in {"backups", "evidence", "secrets", "private", ".venv"}
                             for part in path.parts)
                      or path.name == ".env" or path.name.startswith(".env.")):
                  bad.append(name)
          if bad:
              raise SystemExit("Private files tracked in source: " + repr(bad))
          print("SOURCE_HYGIENE_PASS", len(tracked), "tracked files")
          PY
      - name: Execute package tests without external dependencies
        shell: bash
        run: |
          python3 --version
          python3 -B -m unittest discover -s tests -v
      - name: Repository whitespace check
        shell: bash
        run: git diff --check HEAD
